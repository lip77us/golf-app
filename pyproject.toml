[project]
name = "golf-app"
version = "0.1.0"
description = ""
authors = [
    {name = "lip77us",email = "paul@lipkin.us"}
]
requires-python = ">=3.12"
dependencies = [
    "django (>=6.1.2,<6.2)",
    "psycopg2-binary (>=2.9.11,<3.0.0)",
    "djangorestframework (>=3.18.3,<4.0.0)",
    "gunicorn (>=21.2.0,<22.0.0)",
    "whitenoise (>=6.7.0,<7.0.0)",
    "dj-database-url (>=2.3.0,<3.0.0)",
    "pillow (>=11.0.0,<12.0.0)",
    "pyjwt[crypto] (>=2.9.0,<3.0.0)",
    "httpx[http2] (>=0.27.0,<1.0.0)"
]


# This is a Django app, not a library — there is no `golf_app` package to
# install, so `poetry install` must not try. **It belongs in [tool.poetry],
# not [project]**: `package-mode` is Poetry's own key and PEP 621 has no such
# field, so the copy that sat under [project] was read by nothing and every
# `poetry install` ended in "No file/folder found for package golf-app" and
# an exit code of 1 — after installing everything correctly.
[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
