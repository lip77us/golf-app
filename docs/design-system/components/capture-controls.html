<!-- @dsCard group="Scoring controls" name="Capture controls" subtitle="SpotsDots (⊖ N ⊕) and Skins junk stepper" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Halved · Capture controls</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@600&family=Spline+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--deepPine:#0B1F1A;--pine:#0F6E56;--surface:#EEF3EE;--card:#FFFFFF;--cardBorder:#D3DED6;--muted:#5C6B62;--win:#388E3C;--loss:#D32F2F}
  *{box-sizing:border-box}
  body{margin:0;background:var(--surface);color:var(--deepPine);font-family:"Spline Sans",system-ui,sans-serif;padding:28px}
  h1{font-family:"Schibsted Grotesk",sans-serif;font-weight:600;font-size:22px;margin:0 0 4px}
  p.sub{color:var(--muted);margin:0 0 20px;font-size:13px}
  .lbl{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;margin:16px 0 8px;font-weight:600}
  .prow{display:flex;align-items:center;gap:12px;background:var(--card);border:1.5px solid var(--cardBorder);border-radius:12px;padding:12px 14px;max-width:360px;margin-bottom:10px}
  .nm{flex:1;font-weight:600}
  .dots{display:flex;align-items:center;gap:8px}
  .pm{width:28px;height:28px;border-radius:50%;border:1.5px solid var(--cardBorder);background:#fff;font-size:16px;font-weight:700;color:var(--pine);display:flex;align-items:center;justify-content:center}
  .cnt{min-width:54px;text-align:center;font-size:13px;font-weight:600;font-variant-numeric:tabular-nums}
  .pos{color:var(--win)} .neg{color:var(--loss)}
</style>
</head>
<body>
<a href="../index-contents.html" style="position:fixed;top:12px;right:14px;z-index:99;display:inline-flex;align-items:center;gap:6px;background:#FFFFFF;border:1.5px solid #D3DED6;border-radius:999px;padding:6px 13px 6px 11px;font:500 12px/1 'Spline Sans',system-ui,sans-serif;color:#0F6E56;text-decoration:none;box-shadow:0 1px 3px rgba(11,31,26,.08)">&#8592; Contents</a>
  <h1>Capture controls</h1>
  <p class="sub">Hand-tallied side-game add-ons that render inline in score entry. <b>Spots</b> can go negative (always shows the minus); <b>Skins junk</b> is a non-negative stepper.</p>

  <div class="lbl">SpotsDots — ⊖ N spots ⊕ (signed)</div>
  <div class="prow"><span class="nm">Paul</span><span class="dots"><span class="pm">−</span><span class="cnt pos">2 spots</span><span class="pm">+</span></span></div>
  <div class="prow"><span class="nm">Lee</span><span class="dots"><span class="pm">−</span><span class="cnt neg">−1 spot</span><span class="pm">+</span></span></div>

  <div class="lbl">Skins junk stepper</div>
  <div class="prow"><span class="nm">Dave</span><span class="dots"><span class="pm">−</span><span class="cnt">1 junk</span><span class="pm">+</span></span></div>
  <div class="prow"><span class="nm">Sam</span><span class="dots"><span class="cnt" style="color:var(--muted)">+ junk</span></span></div>
</body>
</html>
