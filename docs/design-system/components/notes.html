<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@600&family=Spline+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{--deepPine:#0B1F1A;--pine:#0F6E56;--surface:#EEF3EE;--card:#FFFFFF;--cardBorder:#D3DED6;--muted:#5C6B62}
  *{box-sizing:border-box}
  body{margin:0;background:var(--surface);color:var(--deepPine);font-family:"Spline Sans",system-ui,sans-serif;padding:28px}
  h1{font-family:"Schibsted Grotesk",sans-serif;font-weight:600;font-size:22px;margin:0 0 4px}
  p.sub{color:var(--muted);margin:0 0 20px;font-size:13px}
  .lbl{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;margin:16px 0 8px;font-weight:600}
  .note{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:13px;max-width:380px;margin-bottom:8px}
  .note b{color:var(--deepPine);font-variant-numeric:tabular-nums}
  .card{background:var(--card);border:1.5px solid var(--cardBorder);border-radius:18px;padding:14px 16px;max-width:380px;display:flex;align-items:center;justify-content:space-between;gap:14px}
  .card .txt{font-size:13.5px} .card .txt small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
  .switch{width:44px;height:26px;border-radius:999px;background:var(--pine);position:relative;flex:none}
  .switch::after{content:"";position:absolute;right:3px;top:3px;width:20px;height:20px;border-radius:50%;background:#fff}
</style>
</head>
