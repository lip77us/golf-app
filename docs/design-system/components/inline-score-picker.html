<!-- @dsCard group="Scoring controls" name="InlineScorePicker" subtitle="Horizontal per-hole score picker, centred on net par" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Halved · InlineScorePicker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@600&family=Spline+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{--deepPine:#0B1F1A;--pine:#0F6E56;--surface:#EEF3EE;--card:#FFFFFF;--cardBorder:#D3DED6;--muted:#5C6B62;--under:#D32F2F}
  *{box-sizing:border-box}
  body{margin:0;background:var(--surface);color:var(--deepPine);font-family:"Spline Sans",system-ui,sans-serif;padding:28px}
  h1{font-family:"Schibsted Grotesk",sans-serif;font-weight:600;font-size:22px;margin:0 0 4px}
  p.sub{color:var(--muted);margin:0 0 22px;font-size:13px}
  .box{background:var(--card);border:2px solid var(--pine);border-radius:14px;padding:14px 8px;max-width:400px;position:relative;overflow:hidden}
  .strip{display:flex;gap:8px;justify-content:center;align-items:center}
  .opt{min-width:46px;height:52px;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;border:1.5px solid var(--cardBorder);background:#fff;font-weight:700;font-size:20px;font-variant-numeric:tabular-nums}
  .opt small{font-size:9px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.3px;margin-top:2px}
  .opt.sel{border-color:var(--pine);box-shadow:0 0 0 3px rgba(15,110,86,.15)}
  .opt.under{color:var(--under)}
  .peek{opacity:.4}
  .fade{position:absolute;top:0;bottom:0;width:26px;pointer-events:none}
  .fade.l{left:0;background:linear-gradient(90deg,#fff,transparent)}
  .fade.r{right:0;background:linear-gradient(270deg,#fff,transparent)}
</style>
</head>
<body>
<a href="../index-contents.html" style="position:fixed;top:12px;right:14px;z-index:99;display:inline-flex;align-items:center;gap:6px;background:#FFFFFF;border:1.5px solid #D3DED6;border-radius:999px;padding:6px 13px 6px 11px;font:500 12px/1 'Spline Sans',system-ui,sans-serif;color:#0F6E56;text-decoration:none;box-shadow:0 1px 3px rgba(11,31,26,.08)">&#8592; Contents</a>
  <h1>InlineScorePicker</h1>
  <p class="sub">The per-hole score picker on every game screen — auto-centred on the net-par gap, birdie/par/bogey/double in full with eagle/triple peeking, edge-fades hint more values. Built on <code>NetScoreButton</code>. −1 clears.</p>
  <div class="box">
    <div class="fade l"></div>
    <div class="strip">
      <span class="opt under peek">2<small>eagle</small></span>
      <span class="opt under">3<small>birdie</small></span>
      <span class="opt sel">4<small>par</small></span>
      <span class="opt">5<small>bogey</small></span>
      <span class="opt">6<small>double</small></span>
      <span class="opt peek">7</span>
    </div>
    <div class="fade r"></div>
  </div>
</body>
</html>
