<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Halved · Tournament leaderboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@600;700&family=Spline+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--deepPine:#0B1F1A;--pine:#0F6E56;--brightMint:#3BD89A;--surface:#EEF3EE;--card:#FFFFFF;--cardBorder:#D3DED6;--muted:#5C6B62;--under:#D32F2F;--win:#388E3C}
  *{box-sizing:border-box}
  body{margin:0;background:#DDE6DE;font-family:"Spline Sans",system-ui,sans-serif;color:var(--deepPine);padding:24px;display:flex;justify-content:center}
  .phone{width:390px;height:812px;background:var(--surface);border:11px solid #0B1F1A;border-radius:40px;overflow:hidden;position:relative;box-shadow:0 24px 60px rgba(6,18,14,.34)}
  .status{height:40px;display:flex;align-items:center;justify-content:space-between;padding:0 22px;font-size:12px;font-weight:600}
  .appbar{display:flex;align-items:center;gap:12px;padding:6px 16px 8px}
  .appbar .ic{font-size:17px}
  .appbar .ttl{font-family:"Schibsted Grotesk",sans-serif;font-weight:600;font-size:18px;flex:1;text-align:center}
  .tabs{display:flex;gap:18px;padding:2px 16px 0;border-bottom:1px solid var(--cardBorder);font-size:13px;font-weight:600;color:var(--muted)}
  .tabs span{padding:8px 0;white-space:nowrap}
  .tabs .on{color:var(--pine);border-bottom:2px solid var(--pine)}
  .body{padding:14px 16px;overflow-y:auto;height:618px}
  .cardhd{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
  .info{font-size:11px;font-weight:600;background:var(--card);border:1px solid var(--cardBorder);border-radius:8px;padding:4px 9px;color:var(--muted)}
  .card{background:var(--card);border:1.5px solid var(--cardBorder);border-radius:16px;overflow:hidden}
  .ch{display:flex;font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.3px;padding:9px 12px;border-bottom:1px solid var(--cardBorder);font-weight:700}
  .ch .g{flex:1}
  .col{width:40px;text-align:right}
  .tr{display:flex;align-items:center;padding:11px 12px;border-bottom:1px solid var(--cardBorder);font-size:13.5px}
  .tr:last-child{border-bottom:none}
  .rk{width:20px;color:var(--muted);font-weight:700}
  .pl{flex:1}.pl small{color:var(--muted);font-size:11px}
  .n{width:40px;text-align:right;font-variant-numeric:tabular-nums}
  .tot{width:40px;text-align:right;font-variant-numeric:tabular-nums;font-weight:700}
  .par{color:var(--under);font-weight:700}
  .pay{width:48px;text-align:right;font-variant-numeric:tabular-nums;color:var(--win);font-weight:700}
  .lead{background:rgba(59,216,154,.10)}
</style>
</head>
<body>

  <div class="phone">
    <div class="status"><span>9:41</span><span>●●● ▮</span></div>
    <div class="appbar"><span class="ic">‹</span><span class="ttl">Tilden Club Championship</span><span class="ic">⚙︎</span></div>
    <div class="tabs"><span class="on">Stroke Play</span><span>Mini Singles</span></div>
    <div class="body">
      <div class="cardhd"><span class="info">Net · best of 2 rounds</span><span class="info">Entry $40</span><span class="info">Thru R2 · 9</span></div>
      <div class="card">
        <div class="ch"><span class="rk">#</span><span class="g">Player</span><span class="col">R1</span><span class="col">R2</span><span class="col">Tot</span><span class="pay">Prize</span></div>
        <div class="tr lead"><span class="rk">1</span><span class="pl">Sam <small>4.1</small></span><span class="n">70</span><span class="n">34*</span><span class="tot par">−4</span><span class="pay">$300</span></div>
        <div class="tr"><span class="rk">2</span><span class="pl">Paul <small>8.2</small></span><span class="n">72</span><span class="n">35*</span><span class="tot par">−1</span><span class="pay">$180</span></div>
        <div class="tr"><span class="rk">3</span><span class="pl">Rae <small>10.5</small></span><span class="n">73</span><span class="n">37*</span><span class="tot">E</span><span class="pay">$100</span></div>
        <div class="tr"><span class="rk">4</span><span class="pl">Dave <small>12.4</small></span><span class="n">74</span><span class="n">38*</span><span class="tot">+2</span><span class="pay">$0</span></div>
        <div class="tr"><span class="rk">5</span><span class="pl">Lee <small>15.9</small></span><span class="n">78</span><span class="n">—</span><span class="tot">+6</span><span class="pay">$0</span></div>
      </div>
    </div>
  </div>
</body>
</html>
