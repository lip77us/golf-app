<!-- @dsCard group="Rounds" name="Create round" subtitle="CasualRoundScreen — course + primary/side game picker" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Halved · Create round</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@600;700&family=Spline+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--deepPine:#0B1F1A;--pine:#0F6E56;--mint:#1D9E75;--brightMint:#3BD89A;--surface:#EEF3EE;--card:#FFFFFF;--cardBorder:#D3DED6;--muted:#5C6B62}
  *{box-sizing:border-box}
  body{margin:0;background:#DDE6DE;font-family:"Spline Sans",system-ui,sans-serif;color:var(--deepPine);padding:24px;display:flex;justify-content:center}
  .phone{width:390px;height:812px;background:var(--surface);border:11px solid #0B1F1A;border-radius:40px;overflow:hidden;position:relative;box-shadow:0 24px 60px rgba(6,18,14,.34)}
  .status{height:40px;display:flex;align-items:center;justify-content:space-between;padding:0 22px;font-size:12px;font-weight:600}
  .appbar{display:flex;align-items:center;gap:12px;padding:6px 16px 10px}
  .appbar .ic{font-size:17px}
  .appbar .ttl{font-family:"Schibsted Grotesk",sans-serif;font-weight:600;font-size:20px;flex:1;text-align:center}
  .body{padding:0 16px;overflow-y:auto;height:632px}
  .h{font-family:"Schibsted Grotesk",sans-serif;font-weight:600;font-size:15px;margin:14px 2px 8px}
  .picked{background:rgba(59,216,154,.14);border:1.5px solid var(--brightMint);border-radius:14px;padding:14px 16px;display:flex;justify-content:space-between;align-items:center}
  .picked .cap{font-size:11px;font-weight:700;color:var(--mint);text-transform:uppercase;letter-spacing:.4px}
  .picked .nm{font-weight:600;font-size:16px;margin-top:2px}
  .picked .chg{color:var(--pine);font-weight:600;font-size:13px}
  .seg{display:flex;background:var(--card);border:1.5px solid var(--cardBorder);border-radius:999px;overflow:hidden}
  .seg div{flex:1;text-align:center;padding:9px 0;font-size:12.5px;font-weight:600;color:var(--muted)}
  .seg div.on{background:var(--pine);color:#fff}
  .chips{display:flex;gap:8px;flex-wrap:wrap}
  .chip{border-radius:12px;padding:8px 14px;font-size:13px;font-weight:500;border:1px solid var(--cardBorder);background:var(--card)}
  .chip.sel{background:var(--pine);color:#fff;border-color:var(--pine);font-weight:600}
  .note{color:var(--muted);font-size:12px;margin-top:8px}
  .bottom{position:absolute;left:0;right:0;bottom:0;padding:12px 16px 18px;display:flex;gap:10px;background:linear-gradient(transparent,var(--surface) 26%)}
  .back{flex:1;height:52px;border-radius:16px;border:1.5px solid var(--pine);background:transparent;color:var(--pine);font-weight:700}
  .next{flex:2;height:52px;border-radius:16px;border:none;background:var(--brightMint);color:var(--deepPine);font-weight:700;font-size:16px}
</style>
</head>
<body>
<a href="../index-contents.html" style="position:fixed;top:12px;right:14px;z-index:99;display:inline-flex;align-items:center;gap:6px;background:#FFFFFF;border:1.5px solid #D3DED6;border-radius:999px;padding:6px 13px 6px 11px;font:500 12px/1 'Spline Sans',system-ui,sans-serif;color:#0F6E56;text-decoration:none;box-shadow:0 1px 3px rgba(11,31,26,.08)">&#8592; Contents</a>
  <div class="phone">
    <div class="status"><span>9:41</span><span>●●● ▮</span></div>
    <div class="appbar"><span class="ic">✕</span><span class="ttl">New Round</span><span style="width:17px"></span></div>
    <div class="body">
      <div class="h">Course</div>
      <div class="picked"><div><div class="cap">Playing today</div><div class="nm">Pebble Dunes GC</div></div><span class="chg">Change</span></div>

      <div class="h">Who’s playing?</div>
      <div class="seg"><div>2</div><div>3</div><div class="on">4</div><div>Across groups</div></div>

      <div class="h">Primary game</div>
      <div class="chips"><span class="chip sel">Skins</span><span class="chip">Nassau</span><span class="chip">Stroke Play</span><span class="chip">Sixes</span><span class="chip">Vegas</span><span class="chip">Wolf</span></div>

      <div class="h">Side games</div>
      <div class="chips"><span class="chip sel">Spots</span><span class="chip">Stableford</span><span class="chip">Honors</span><span class="chip">Stroke Play</span></div>
      <div class="note">Side games appear as leaderboard tabs; Spots adds a capture control in score entry.</div>
    </div>
    <div class="bottom"><button class="back">Back</button><button class="next">Next</button></div>
  </div>
</body>
</html>
