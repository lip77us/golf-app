<!-- @dsCard group="Rounds" name="Round hub" subtitle="RoundScreen — round info + foursome card + Complete Round" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Halved · Round hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@600;700&family=Spline+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--deepPine:#0B1F1A;--pine:#0F6E56;--mint:#1D9E75;--brightMint:#3BD89A;--surface:#EEF3EE;--card:#FFFFFF;--cardBorder:#D3DED6;--muted:#5C6B62;--blue:#1976D2;--orange:#EF6C00}
  *{box-sizing:border-box}
  body{margin:0;background:#DDE6DE;font-family:"Spline Sans",system-ui,sans-serif;color:var(--deepPine);padding:24px;display:flex;justify-content:center}
  .phone{width:390px;height:812px;background:var(--surface);border:11px solid #0B1F1A;border-radius:40px;overflow:hidden;position:relative;box-shadow:0 24px 60px rgba(6,18,14,.34)}
  .status{height:40px;display:flex;align-items:center;justify-content:space-between;padding:0 22px;font-size:12px;font-weight:600}
  .appbar{display:flex;align-items:center;gap:14px;padding:6px 16px 12px}
  .appbar .ic{font-size:18px}
  .appbar .ttl{font-family:"Schibsted Grotesk",sans-serif;font-weight:600;font-size:20px;flex:1;text-align:center}
  .body{padding:0 16px;overflow-y:auto;height:632px}
  .card{background:var(--card);border:1.5px solid var(--cardBorder);border-radius:18px;padding:16px;margin-bottom:14px}
  .rt{font-weight:700;font-size:17px}
  .rmeta{color:var(--muted);font-size:12.5px;margin-top:2px}
  .row1{display:flex;gap:8px;margin-top:10px;align-items:center;flex-wrap:wrap}
  .pill{font-size:11px;font-weight:700;border-radius:8px;padding:3px 9px}
  .pill.prog{background:var(--pine);color:#fff}
  .chip{font-size:11px;font-weight:600;border:1px solid var(--cardBorder);border-radius:8px;padding:3px 8px}
  .fh{display:flex;align-items:center;justify-content:space-between;margin-bottom:2px}
  .fh .g{font-weight:700;font-size:15px}
  .fh .mv{color:var(--muted);font-size:18px}
  .players{margin:8px 0 4px}
  .pl{display:flex;align-items:center;gap:8px;padding:6px 0;font-size:14px}
  .dot{width:8px;height:8px;border-radius:50%}
  .b{background:var(--blue)} .o{background:var(--orange)}
  .pl .hc{margin-left:auto;color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
  .enter{width:100%;height:50px;border-radius:14px;background:var(--brightMint);color:var(--deepPine);border:none;font-weight:700;font-size:15px;margin-top:8px}
  .obtn{width:100%;height:46px;border-radius:12px;background:transparent;border:1.5px solid var(--pine);color:var(--pine);font-weight:600;font-size:14px;margin-top:8px}
  .bottom{position:absolute;left:0;right:0;bottom:0;padding:12px 16px 18px;background:linear-gradient(transparent,var(--surface) 22%)}
  .complete{width:100%;height:54px;border-radius:16px;background:var(--pine);color:#fff;border:none;font-weight:700;font-size:16px}
</style>
</head>
<body>
<a href="../index-contents.html" style="position:fixed;top:12px;right:14px;z-index:99;display:inline-flex;align-items:center;gap:6px;background:#FFFFFF;border:1.5px solid #D3DED6;border-radius:999px;padding:6px 13px 6px 11px;font:500 12px/1 'Spline Sans',system-ui,sans-serif;color:#0F6E56;text-decoration:none;box-shadow:0 1px 3px rgba(11,31,26,.08)">&#8592; Contents</a>
  <div class="phone">
    <div class="status"><span>9:41</span><span>●●● ▮</span></div>
    <div class="appbar"><span class="ic">✕</span><span class="ttl">Skins + Nassau</span><span class="ic">💬</span><span class="ic">📊</span></div>
    <div class="body">
      <div class="card">
        <div class="rt">Pebble Dunes GC</div>
        <div class="rmeta">Jul 29, 2026</div>
        <div class="row1"><span class="pill prog">IN PROGRESS</span><span class="rmeta">$2.00 / unit</span></div>
        <div class="row1"><span class="chip">Skins</span><span class="chip">Nassau</span><span class="chip">Spots</span></div>
      </div>
      <div class="rmeta" style="font-weight:700;color:var(--deepPine);margin:0 2px 8px">Foursomes</div>
      <div class="card">
        <div class="fh"><span class="g">Group 1</span><span class="mv">⋮</span></div>
        <div class="players">
          <div class="pl"><span class="dot b"></span>Paul<span class="hc">CH 8 · PH 7</span></div>
          <div class="pl"><span class="dot b"></span>Dave<span class="hc">CH 12 · PH 11</span></div>
          <div class="pl"><span class="dot o"></span>Sam<span class="hc">CH 4 · PH 4</span></div>
          <div class="pl"><span class="dot o"></span>Lee<span class="hc">CH 16 · PH 14</span></div>
        </div>
        <button class="enter">⛳ Enter Scores</button>
        <button class="obtn">Add side game</button>
      </div>
    </div>
    <div class="bottom"><button class="complete">Complete Round</button></div>
  </div>
</body>
</html>
