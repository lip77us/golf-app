<!-- @dsCard group="Games" name="Game setup (Skins)" subtitle="SkinsSetupScreen — handicap, options, payout, stake" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Halved · Skins setup</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@600;700&family=Spline+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--deepPine:#0B1F1A;--pine:#0F6E56;--brightMint:#3BD89A;--surface:#EEF3EE;--card:#FFFFFF;--cardBorder:#D3DED6;--muted:#5C6B62;--win:#388E3C}
  *{box-sizing:border-box}
  body{margin:0;background:#DDE6DE;font-family:"Spline Sans",system-ui,sans-serif;color:var(--deepPine);padding:24px;display:flex;justify-content:center}
  .phone{width:390px;height:812px;background:var(--surface);border:11px solid #0B1F1A;border-radius:40px;overflow:hidden;position:relative;box-shadow:0 24px 60px rgba(6,18,14,.34)}
  .status{height:40px;display:flex;align-items:center;justify-content:space-between;padding:0 22px;font-size:12px;font-weight:600}
  .appbar{display:flex;align-items:center;gap:12px;padding:6px 16px 10px}
  .appbar .ic{font-size:17px}
  .appbar .ttl{font-family:"Schibsted Grotesk",sans-serif;font-weight:600;font-size:20px;flex:1;text-align:center}
  .body{padding:0 16px;overflow-y:auto;height:632px}
  .rb{display:flex;align-items:center;gap:8px;background:rgba(56,142,60,.10);color:var(--win);border-radius:12px;padding:10px 14px;font-size:13px;font-weight:600;margin-bottom:12px}
  .card{background:var(--card);border:1.5px solid var(--cardBorder);border-radius:18px;padding:14px 16px;margin-bottom:12px}
  .ct{font-family:"Schibsted Grotesk",sans-serif;font-weight:600;color:var(--pine);font-size:14px;margin-bottom:10px}
  .seg{display:flex;border:1.5px solid var(--pine);border-radius:999px;overflow:hidden;margin-bottom:12px}
  .seg div{flex:1;text-align:center;padding:9px 0;font-size:12.5px;font-weight:600;color:var(--pine)}
  .seg div.on{background:var(--pine);color:#fff}
  .srow{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);margin-bottom:6px}
  .track{height:6px;border-radius:999px;background:var(--cardBorder);position:relative;margin-bottom:4px}
  .fill{position:absolute;left:0;top:0;bottom:0;width:80%;background:var(--pine);border-radius:999px}
  .knob{position:absolute;left:calc(80% - 9px);top:-6px;width:18px;height:18px;border-radius:50%;background:#fff;border:2px solid var(--pine)}
  .opt{display:flex;justify-content:space-between;align-items:center;padding:8px 0;font-size:14px}
  .switch{width:44px;height:26px;border-radius:999px;background:var(--pine);position:relative}
  .switch.off{background:var(--cardBorder)}
  .switch::after{content:"";position:absolute;right:3px;top:3px;width:20px;height:20px;border-radius:50%;background:#fff}
  .switch.off::after{right:auto;left:3px}
  .field{display:flex;align-items:center;border:1.5px solid var(--cardBorder);border-radius:12px;padding:11px 14px;font-size:16px;font-weight:600}
  .field .pfx{color:var(--muted);margin-right:6px}
  .bottom{position:absolute;left:0;right:0;bottom:0;padding:12px 16px 18px;background:linear-gradient(transparent,var(--surface) 26%)}
  .start{width:100%;height:54px;border-radius:16px;border:none;background:var(--pine);color:#fff;font-weight:700;font-size:16px}
</style>
</head>
<body>
<a href="../index-contents.html" style="position:fixed;top:12px;right:14px;z-index:99;display:inline-flex;align-items:center;gap:6px;background:#FFFFFF;border:1.5px solid #D3DED6;border-radius:999px;padding:6px 13px 6px 11px;font:500 12px/1 'Spline Sans',system-ui,sans-serif;color:#0F6E56;text-decoration:none;box-shadow:0 1px 3px rgba(11,31,26,.08)">&#8592; Contents</a>
  <div class="phone">
    <div class="status"><span>9:41</span><span>●●● ▮</span></div>
    <div class="appbar"><span class="ic">‹</span><span class="ttl">Skins Setup</span><span style="width:17px"></span></div>
    <div class="body">
      <div class="rb">✓ 4 players — good to go</div>
      <div class="card">
        <div class="ct">Handicap</div>
        <div class="seg"><div class="on">Net</div><div>Gross</div><div>Strokes Off</div></div>
        <div class="srow"><span>Net allowance</span><span>90%</span></div>
        <div class="track"><div class="fill"></div><div class="knob"></div></div>
      </div>
      <div class="card">
        <div class="ct">Game options</div>
        <div class="opt"><span>Carryover on ties</span><span class="switch"></span></div>
        <div class="opt"><span>Junk skins</span><span class="switch off"></span></div>
      </div>
      <div class="card">
        <div class="ct">How the money settles</div>
        <div class="seg"><div class="on">Pool</div><div>Per skin</div></div>
        <div class="ct" style="color:var(--deepPine);margin:8px 0 6px;font-size:13px">Ante per player</div>
        <div class="field"><span class="pfx">$</span>2.00</div>
      </div>
    </div>
    <div class="bottom"><button class="start">Start Game</button></div>
  </div>
</body>
</html>
