<!-- @dsCard group="Tournaments" name="Tournament wizard" subtitle="NewRoundWizard — groups & tees (drag to assign)" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Halved · Tournament wizard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@600;700&family=Spline+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--deepPine:#0B1F1A;--pine:#0F6E56;--brightMint:#3BD89A;--surface:#EEF3EE;--card:#FFFFFF;--cardBorder:#D3DED6;--muted:#5C6B62;--g1:#1565C0;--g2:#2E7D32;--g3:#B71C1C}
  *{box-sizing:border-box}
  body{margin:0;background:#DDE6DE;font-family:"Spline Sans",system-ui,sans-serif;color:var(--deepPine);padding:24px;display:flex;justify-content:center}
  .phone{width:390px;height:812px;background:var(--surface);border:11px solid #0B1F1A;border-radius:40px;overflow:hidden;position:relative;box-shadow:0 24px 60px rgba(6,18,14,.34)}
  .status{height:40px;display:flex;align-items:center;justify-content:space-between;padding:0 22px;font-size:12px;font-weight:600}
  .appbar{padding:6px 16px 8px;display:flex;align-items:center;gap:12px}
  .appbar .ic{font-size:17px}
  .appbar .ttl{font-family:"Schibsted Grotesk",sans-serif;font-weight:600;font-size:17px;flex:1;text-align:center}
  .prog{height:4px;background:var(--cardBorder);margin:0 0 4px}
  .prog .f{height:4px;width:66%;background:var(--pine)}
  .body{padding:12px 16px;overflow-y:auto;height:624px}
  .h{font-family:"Schibsted Grotesk",sans-serif;font-weight:600;font-size:16px}
  .p{color:var(--muted);font-size:12.5px;margin:4px 0 14px}
  .gchips{display:flex;gap:8px;margin-bottom:10px}
  .gc{font-size:11.5px;font-weight:700;border-radius:8px;padding:4px 10px;color:#fff}
  .row{display:flex;align-items:center;gap:10px;background:var(--card);border:1.5px solid var(--cardBorder);border-radius:12px;padding:11px 14px;margin-bottom:8px}
  .grip{color:var(--muted);font-size:16px;letter-spacing:-2px}
  .nm{flex:1;font-weight:500}
  .tee{border:1.5px solid var(--pine);color:var(--pine);border-radius:9px;padding:6px 10px;font-size:12px;font-weight:600}
  .gb{width:24px;height:24px;border-radius:7px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:11px;font-weight:700}
  .bottom{position:absolute;left:0;right:0;bottom:0;padding:12px 16px 18px;display:flex;gap:10px;background:linear-gradient(transparent,var(--surface) 26%)}
  .back{flex:1;height:52px;border-radius:16px;border:1.5px solid var(--pine);background:transparent;color:var(--pine);font-weight:700}
  .next{flex:2;height:52px;border-radius:16px;border:none;background:var(--pine);color:#fff;font-weight:700;font-size:16px}
</style>
</head>
<body>
<a href="../index-contents.html" style="position:fixed;top:12px;right:14px;z-index:99;display:inline-flex;align-items:center;gap:6px;background:#FFFFFF;border:1.5px solid #D3DED6;border-radius:999px;padding:6px 13px 6px 11px;font:500 12px/1 'Spline Sans',system-ui,sans-serif;color:#0F6E56;text-decoration:none;box-shadow:0 1px 3px rgba(11,31,26,.08)">&#8592; Contents</a>
  <div class="phone">
    <div class="status"><span>9:41</span><span>●●● ▮</span></div>
    <div class="appbar"><span class="ic">‹</span><span class="ttl">New Round&nbsp;&nbsp;(4 of 6)</span><span style="width:17px"></span></div>
    <div class="prog"><div class="f"></div></div>
    <div class="body">
      <div class="h">Groups &amp; tees</div>
      <div class="p">Drag golfers to balance groups; pick each player’s tee.</div>
      <div class="gchips"><span class="gc" style="background:var(--g1)">Group 1</span><span class="gc" style="background:var(--g2)">Group 2</span><span class="gc" style="background:var(--g3)">Group 3</span></div>
      <div class="row"><span class="grip">⣿</span><span class="gb" style="background:var(--g1)">1</span><span class="nm">Sam Lopez</span><span class="tee">Black ▾</span></div>
      <div class="row"><span class="grip">⣿</span><span class="gb" style="background:var(--g1)">1</span><span class="nm">Paul Lipkin</span><span class="tee">Blue ▾</span></div>
      <div class="row"><span class="grip">⣿</span><span class="gb" style="background:var(--g1)">1</span><span class="nm">Rae Avery</span><span class="tee">White ▾</span></div>
      <div class="row"><span class="grip">⣿</span><span class="gb" style="background:var(--g2)">2</span><span class="nm">Dave Miller</span><span class="tee">Blue ▾</span></div>
      <div class="row"><span class="grip">⣿</span><span class="gb" style="background:var(--g2)">2</span><span class="nm">Lee Brooks</span><span class="tee">White ▾</span></div>
      <div class="row"><span class="grip">⣿</span><span class="gb" style="background:var(--g3)">3</span><span class="nm">Jo Chen</span><span class="tee">Blue ▾</span></div>
    </div>
    <div class="bottom"><button class="back">Back</button><button class="next">Next</button></div>
  </div>
</body>
</html>
