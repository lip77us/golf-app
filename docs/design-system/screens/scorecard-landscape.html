<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Halved · Scorecard (landscape)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@600;700&family=Spline+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--deepPine:#0B1F1A;--pine:#0F6E56;--surface:#EEF3EE;--card:#FFFFFF;--cardBorder:#D3DED6;--muted:#5C6B62;--under:#D32F2F;--head:#E7EEE9;--par:#F3F6F4}
  *{box-sizing:border-box}
  body{margin:0;background:#DDE6DE;font-family:"Spline Sans",system-ui,sans-serif;color:var(--deepPine);padding:24px;display:flex;justify-content:center}
  .phone{width:812px;max-width:100%;height:392px;background:var(--surface);border:11px solid #0B1F1A;border-radius:36px;overflow:hidden;position:relative;box-shadow:0 24px 60px rgba(6,18,14,.34)}
  .bar{display:flex;align-items:center;gap:10px;padding:8px 18px}
  .bar .ttl{font-family:"Schibsted Grotesk",sans-serif;font-weight:600;font-size:16px;flex:1}
  .bar .ic{font-size:15px;color:var(--muted)}
  .scroll{overflow:auto;height:322px;padding:0 12px 12px}
  table{border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:12px;width:100%}
  th,td{border:1px solid var(--cardBorder);padding:5px 7px;text-align:center;white-space:nowrap}
  th{background:var(--head);font-weight:700}
  td.nm,th.nm{text-align:left;font-weight:600;background:#fff;position:sticky;left:0;z-index:1}
  tr.parrow td{background:var(--par);color:var(--muted);font-weight:600}
  td.sum,th.sum{background:var(--head);font-weight:700}
  .dot{display:inline-block;width:4px;height:4px;border-radius:50%;background:var(--pine);margin:0 1px}
  .u{color:var(--under);font-weight:700}
  .dots{height:6px;line-height:6px}
</style>
</head>
<body>
<a href="../index-contents.html" style="position:fixed;top:12px;right:14px;z-index:99;display:inline-flex;align-items:center;gap:6px;background:#FFFFFF;border:1.5px solid #D3DED6;border-radius:999px;padding:6px 13px 6px 11px;font:500 12px/1 'Spline Sans',system-ui,sans-serif;color:#0F6E56;text-decoration:none;box-shadow:0 1px 3px rgba(11,31,26,.08)">&#8592; Contents</a>
  <div class="phone">
    <div class="bar"><span class="ttl">Pebble Dunes GC — Group 1</span><span class="ic">rotate ⟳</span><span class="ic">✕</span></div>
    <div class="scroll">
      <table>
        <tr>
          <th class="nm">Hole</th>
          <th>1</th><th>2</th><th>3</th><th>4</th><th>5</th><th>6</th><th>7</th><th>8</th><th>9</th><th class="sum">OUT</th>
          <th>10</th><th>11</th><th>12</th><th>13</th><th>14</th><th>15</th><th>16</th><th>17</th><th>18</th><th class="sum">IN</th><th class="sum">TOT</th>
        </tr>
        <tr class="parrow">
          <td class="nm">Par</td>
          <td>4</td><td>3</td><td>5</td><td>4</td><td>4</td><td>4</td><td>4</td><td>3</td><td>5</td><td class="sum">36</td>
          <td>4</td><td>5</td><td>3</td><td>4</td><td>4</td><td>5</td><td>3</td><td>4</td><td>4</td><td class="sum">36</td><td class="sum">72</td>
        </tr>
        <tr>
          <td class="nm">Paul</td>
          <td>4</td><td><span class="dots"><span class="dot"></span></span><br><span class="u">2</span></td><td>5</td><td>5</td><td>4</td><td>4</td><td>4</td><td>3</td><td>6</td><td class="sum">37</td>
          <td>4</td><td>6</td><td>3</td><td>4</td><td>5</td><td>5</td><td>3</td><td>5</td><td>4</td><td class="sum">39</td><td class="sum">76</td>
        </tr>
        <tr>
          <td class="nm">Dave</td>
          <td>5</td><td>3</td><td><span class="dots"><span class="dot"></span></span><br>6</td><td>4</td><td>5</td><td>4</td><td>5</td><td>4</td><td>5</td><td class="sum">41</td>
          <td>5</td><td>6</td><td>4</td><td>5</td><td>4</td><td>6</td><td>3</td><td>5</td><td>5</td><td class="sum">43</td><td class="sum">84</td>
        </tr>
        <tr>
          <td class="nm">Sam</td>
          <td>4</td><td>3</td><td><span class="u">4</span></td><td>4</td><td>4</td><td>3</td><td>4</td><td>3</td><td>5</td><td class="sum">34</td>
          <td>4</td><td>5</td><td>3</td><td>4</td><td>4</td><td>5</td><td>2</td><td>4</td><td>4</td><td class="sum">35</td><td class="sum">69</td>
        </tr>
        <tr>
          <td class="nm">Lee</td>
          <td>5</td><td>4</td><td>6</td><td><span class="dots"><span class="dot"></span></span><br>5</td><td>5</td><td>5</td><td>4</td><td>4</td><td>6</td><td class="sum">44</td>
          <td>5</td><td>6</td><td>4</td><td>5</td><td>5</td><td>6</td><td>4</td><td>5</td><td>5</td><td class="sum">45</td><td class="sum">89</td>
        </tr>
      </table>
    </div>
  </div>
</body>
</html>
